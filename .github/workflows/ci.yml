name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-compile:
    name: Python compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: python -m compileall shared api_gateway workers

  python-dependencies:
    name: Python dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api_gateway
          - workers/text_extractor
          - workers/media_extractor
          - workers/cron_notifier

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ matrix.service }}/requirements.txt"

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if [ -x node_modules/.bin/eslint ] && ls eslint.config.* .eslintrc.* >/dev/null 2>&1; then
            npm run lint
          else
            echo "Skipping lint: ESLint binary or config is not available"
          fi

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api-gateway
            dockerfile: api_gateway/Dockerfile
          - name: text-extractor
            dockerfile: workers/text_extractor/Dockerfile
          - name: media-extractor
            dockerfile: workers/media_extractor/Dockerfile
          - name: cron-notifier
            dockerfile: workers/cron_notifier/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.image.name }}
        run: docker build -f "${{ matrix.image.dockerfile }}" .

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

  kubernetes-manifests:
    name: Kubernetes manifest syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Parse manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          files = sorted(Path("k8s").rglob("*.yaml")) + sorted(Path("k8s").rglob("*.yml"))
          if not files:
              print("No Kubernetes manifests found")
              sys.exit(1)

          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  list(yaml.safe_load_all(handle))
              print(f"Parsed {path}")
          PY
