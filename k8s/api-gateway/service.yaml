apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sieve
  labels:
    app: api-gateway
spec:
  type: LoadBalancer  # Use LoadBalancer for external access
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  sessionAffinity: None
