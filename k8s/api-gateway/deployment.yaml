apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sieve
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: sieve/api-gateway:latest  # TODO: Replace with your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: sieve-secrets
              key: telegram-bot-token
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: sieve-config
              key: RABBITMQ_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: sieve-config
              key: REDIS_URL
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: sieve-config
              key: DATABASE_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
