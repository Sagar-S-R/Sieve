apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: sieve
data:
  init.sql: |
    -- Create tasks table
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL,
        group_id BIGINT NOT NULL,
        message_sender_id BIGINT,
        title TEXT NOT NULL,
        action_required TEXT NOT NULL,
        deadline TIMESTAMP WITH TIME ZONE NOT NULL,
        reminder_level INTEGER DEFAULT 0,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Create group_subscriptions table
    CREATE TABLE IF NOT EXISTS group_subscriptions (
        id SERIAL PRIMARY KEY,
        group_id BIGINT NOT NULL,
        subscriber_id BIGINT NOT NULL,
        subscribed_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        UNIQUE(group_id, subscriber_id)
    );

    -- Create indexes
    CREATE INDEX IF NOT EXISTS idx_tasks_user_id ON tasks(user_id);
    CREATE INDEX IF NOT EXISTS idx_tasks_group_id ON tasks(group_id);
    CREATE INDEX IF NOT EXISTS idx_tasks_deadline ON tasks(deadline);
    CREATE INDEX IF NOT EXISTS idx_tasks_reminder_level ON tasks(reminder_level);
    CREATE INDEX IF NOT EXISTS idx_group_subscriptions_group_id ON group_subscriptions(group_id);
    CREATE INDEX IF NOT EXISTS idx_group_subscriptions_subscriber_id ON group_subscriptions(subscriber_id);
